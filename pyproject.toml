[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphapulse"
version = "0.1.0"
description = "AI-powered global market intelligence for US equities, macro trends, and institutional flow analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["stocks", "finance", "market-analysis", "equities", "technical-analysis", "fundamental-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "python-dateutil>=2.8.0",
    "tenacity>=8.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
]

[project.optional-dependencies]
disk = ["diskcache>=5.0.0"]
fred = ["fredapi>=0.5.0"]
sec = ["sec-edgar-downloader>=5.0.0"]
all = ["alphapulse[disk,fred,sec]"]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "vcrpy>=6.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/alphapulse/alphapulse"
Repository = "https://github.com/alphapulse/alphapulse"

[tool.hatch.build.targets.wheel]
packages = ["alphapulse"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"
